; Wio Tracker L1 companion radio: USB CLI + BLE, with the CJ on-device UI.
;
; Same conflict-free rationale as wio-tracker-l1-usb-ble -- this env lives in its own
; variant directory, so the fork still touches NO file that upstream edits. platformio.ini
; pulls in every variants/*/platformio.ini via extra_configs, and PlatformIO merges all
; of them before resolving `extends`, so extending [WioTrackerL1] from here works even
; though that section is defined in the upstream variant file.
;
; The ONLY difference from the usb_ble env is which UI directory is compiled:
;   -I examples/companion_radio/ui-cj   (instead of ui-new)
;   +<../examples/companion_radio/ui-cj/*.cpp>
; main.cpp does a bare #include "UITask.h", so the include path alone selects the UI.
; -D UI_CJ=1 is available for any conditional code that needs to know.
;
; ui-cj adds three screens the stock companion UI does not have -- contact list,
; message log with full-text reading, and canned-message sending -- reached from the
; home screen with UP and DOWN.
;
; NOTE lib_deps: end2endzone/NonBlockingRTTTL is REQUIRED here. helpers/ui/buzzer.cpp
; is in build_src_filter and includes <NonBlockingRtttl.h>; neither [WioTrackerL1] nor
; nrf52_base provides it. The stock companion envs declare it explicitly and the
; usb_ble env omits it, which only builds where a previous build left it in .pio.
;
; The same DO-NOT-ENABLE rules as usb_ble apply: BLE_DEBUG_LOGGING, MESH_DEBUG and
; MESH_PACKET_LOGGING all write to the Serial stream that ArduinoSerialInterface uses
; for binary frames, and corrupt the USB CLI protocol.

[env:WioTrackerL1_companion_radio_cj]
extends = WioTrackerL1
board_build.ldscript = boards/nrf52840_s140_v7_extrafs.ld
board_upload.maximum_size = 708608
build_flags = ${WioTrackerL1.build_flags}
  -I examples/companion_radio/ui-cj
  -D UI_CJ=1
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D DISPLAY_CLASS=SH1106Display
  -D UI_HAS_JOYSTICK=1
  -D OFFLINE_QUEUE_SIZE=256
  -D PIN_BUZZER=12
  -D QSPIFLASH=1
  -D ENABLE_USB_INTERFACE
  -D BLE_PIN_CODE=123456
  -D ADVERT_NAME='"@@MAC"'
; NOTE: DO NOT ENABLE -->  -D BLE_DEBUG_LOGGING=1
; NOTE: DO NOT ENABLE -->  -D MESH_PACKET_LOGGING=1
; NOTE: DO NOT ENABLE -->  -D MESH_DEBUG=1
build_src_filter = ${WioTrackerL1.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-cj/*.cpp>
  +<helpers/ui/SH1106Display.cpp>
  +<helpers/ui/buzzer.cpp>
lib_deps = ${WioTrackerL1.lib_deps}
  adafruit/RTClib @ ^2.1.3
  densaugeo/base64 @ ~1.4.0
  end2endzone/NonBlockingRTTTL@^1.3.0
