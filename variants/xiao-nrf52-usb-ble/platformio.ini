; Xiao nRF52840 (+ Wio-SX1262) companion radio with BOTH the USB serial CLI and
; BLE active -- the Xiao counterpart of WioTrackerL1_companion_radio_usb_ble.
;
; Same rationale as the Wio variant: this lives in its OWN variant directory so
; the fork touches no file upstream edits. platformio.ini pulls in every
; variants/*/platformio.ini via extra_configs and merges them before resolving
; `extends`, so extending [Xiao_nrf52] (defined in variants/xiao_nrf52/) works
; from here and upstream releases merge without conflict.
;
; This is upstream's Xiao_nrf52_companion_radio_ble env plus ENABLE_USB_INTERFACE.
; companion_radio/main.cpp registers each transport into MultiSerialInterface via
; independent #if blocks (no #elif) and MAX_INTERFACES is 4, so both run at once.
;
; Unlike the Wio L1 this board has no display/joystick/buzzer, so it builds the
; ui-orig UI and needs none of the SH1106/buzzer sources.
;
; DO NOT add BLE_DEBUG_LOGGING / MESH_DEBUG / MESH_PACKET_LOGGING here: they
; expand to Serial.printf() on the same stream ArduinoSerialInterface uses for
; binary frames, which corrupts the USB CLI protocol.
;
; Do NOT build with DISABLE_DEBUG=1 -- it passes -UCFG_DEBUG, which the Adafruit
; nRF52 core requires (cores/nRF5/rtos.cpp), and the build fails.

[env:Xiao_nrf52_companion_radio_usb_ble]
extends = Xiao_nrf52
board_build.ldscript = boards/nrf52840_s140_v7_extrafs.ld
board_upload.maximum_size = 708608
build_flags =
  ${Xiao_nrf52.build_flags}
  -I examples/companion_radio/ui-orig
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
  -D QSPIFLASH=1
  -D ENABLE_USB_INTERFACE
; NOTE: DO NOT ENABLE -->  -D BLE_DEBUG_LOGGING=1
; NOTE: DO NOT ENABLE -->  -D MESH_PACKET_LOGGING=1
; NOTE: DO NOT ENABLE -->  -D MESH_DEBUG=1
build_src_filter = ${Xiao_nrf52.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-orig/*.cpp>
lib_deps =
  ${Xiao_nrf52.lib_deps}
  densaugeo/base64 @ ~1.4.0
