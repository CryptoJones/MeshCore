; Wio Tracker L1 companion radio with BOTH the USB serial CLI and BLE active.
;
; This lives in its own variant directory ON PURPOSE. platformio.ini pulls in
; every variants/*/platformio.ini via extra_configs, so defining the env here
; instead of appending it to variants/wio-tracker-l1/platformio.ini means this
; fork touches NO file upstream edits -- upstream releases merge without
; conflict. The env still extends [WioTrackerL1], which is defined in that
; upstream file; PlatformIO merges all extra_configs before resolving extends.
;
; Why both transports work at once: examples/companion_radio/main.cpp registers
; each compiled-in transport into MultiSerialInterface via independent #if
; blocks (no #elif), and MAX_INTERFACES is 4 ("ble, usb, wifi, ethernet").
;
; DO NOT add BLE_DEBUG_LOGGING here. It expands to Serial.printf(), and
; ArduinoSerialInterface uses that same Serial stream for binary frames, so it
; corrupts the USB CLI protocol. Same reason MESH_DEBUG and MESH_PACKET_LOGGING
; must stay off in any env with ENABLE_USB_INTERFACE.
;
; Do NOT build this with DISABLE_DEBUG=1 -- it also passes -UCFG_DEBUG, which
; the Adafruit nRF52 core requires (cores/nRF5/rtos.cpp), and the build fails.

[env:WioTrackerL1_companion_radio_usb_ble]
extends = WioTrackerL1
board_build.ldscript = boards/nrf52840_s140_v7_extrafs.ld
board_upload.maximum_size = 708608
build_flags = ${WioTrackerL1.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D DISPLAY_CLASS=SH1106Display
  -D UI_HAS_JOYSTICK=1
  -D OFFLINE_QUEUE_SIZE=256
  -D PIN_BUZZER=12
  -D QSPIFLASH=1
  -D ENABLE_USB_INTERFACE
  -D BLE_PIN_CODE=123456
  -D ADVERT_NAME='"@@MAC"'
; NOTE: DO NOT ENABLE -->  -D BLE_DEBUG_LOGGING=1
; NOTE: DO NOT ENABLE -->  -D MESH_PACKET_LOGGING=1
; NOTE: DO NOT ENABLE -->  -D MESH_DEBUG=1
build_src_filter = ${WioTrackerL1.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
  +<helpers/ui/SH1106Display.cpp>
  +<helpers/ui/buzzer.cpp>
lib_deps = ${WioTrackerL1.lib_deps}
  adafruit/RTClib @ ^2.1.3
  densaugeo/base64 @ ~1.4.0
  end2endzone/NonBlockingRTTTL@^1.3.0
